<!DOCTYPE html>

<body>
    <header class="cabecalho">
        <h1>Confere Aí</h1>
        <nav>
            <a href="#" class="cabecalho-link">Inicio</a>
        </nav>
    </header>
    <main>
        <h2>Descubra a verdade passando o mouse</h2>
        <section>
        <article class="cartao">
            <div class="cartao-interno">
                <div class="cartao-frente">
                    <img src="https://thumbs.dreamstime.com/b/hyperrealistic-painting-flying-penguin-penguin-gracefully-soars-sky-surrounded-icy-landscapes-fluffy-285599569.jpg" alt="Pinguim" class="cartao-imagem">
                    <p>Quem choca o ovo: o pai ou a mãe?</p>
                </div>
                <div class="cartao-verso">
                    <img src="https://static.nationalgeographicbrasil.com/files/styles/image_3200/public/mm1012723121410486.jpg?w=1900&h=2849" alt="Pinguim"  class="cartao-imagem">
                    <p>Ambos dividem as tarefas na maioria das espécies.</p>
                </div>
            </div>
        </article>
<article class="cartao">
            <div class="cartao-interno">
                <div class="cartao-frente">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTp1LiVZOWk1KC5gLWKlkSPo9CAmQgi1UFe8-POWGKmGjAZoycEU-I68J1e&s=10" alt="Baleia" class="cartao-imagem">
                    <p>A baleia-azul é um peixe?</p>
                </div>
                <div class="cartao-verso">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcHHvAYr_Lnh3VQq6-dVaBJDeI-Obil3XzpGiRjGCTLA&s=10" alt="Baleia"  class="cartao-imagem">
                    <p>Não, ela é um mamífero marinho.</p>
                </div>
            </div>
        </article>

        </section>
    </main>
